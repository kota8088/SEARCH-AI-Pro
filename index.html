<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEARCH AI-Pro</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        sans: ['Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        space: {
                            900: '#070b19',
                            800: '#0f172a',
                            700: '#1e293b',
                            600: '#334155',
                        },
                        neon: {
                            cyan: '#38bdf8',
                            purple: '#c084fc',
                            blue: '#60a5fa',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Gen AI SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #0f172a 0%, #030712 100%);
            color: #f8fafc;
            min-height: 100vh;
            scroll-behavior: smooth;
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .glow-button {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
            transform: translateY(-1px);
        }
        .loader {
            border-top-color: #38bdf8;
            animation: spinner 0.8s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* スライドパネルのアニメーション */
        .side-panel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        .side-panel.open {
            transform: translateX(0);
        }
        /* 横スクロールバーのカスタマイズ */
        .horizontal-scroll {
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.5) rgba(15, 23, 42, 0.8);
        }
        .horizontal-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .horizontal-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 4px;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 4px;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }
        /* メニューバー全体の折りたたみアニメーション */
        .menu-collapse {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 200px;
            opacity: 1;
            overflow: hidden;
        }
        .menu-collapse.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-4 md:p-8 min-h-screen relative overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto flex flex-col mb-8 pb-4 border-b border-slate-800 gap-4">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center space-x-3 shrink-0">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center glow-button">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <h1 class="font-orbitron text-xl md:text-2xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
                    SEARCH AI-Pro
                </h1>
            </div>
            <!-- ボタン自体の出し入れ（表示・非表示）トグルボタン -->
            <button onclick="toggleMenuCollapse()" id="menuToggleBtn" class="text-xs md:text-sm font-orbitron px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700 transition flex items-center space-x-1.5 glow-button">
                <span>▲ ボタンを隠す</span>
            </button>
        </div>

        <!-- 横スクロール対応メニューバー（開閉対象） -->
        <div id="menuBarContainer" class="menu-collapse w-full flex items-center pt-2">
            <div class="horizontal-scroll w-full max-w-full pb-2 flex items-center space-x-2">
                <button onclick="toggleNotificationSetting()" id="notifToggleBtn" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-yellow-400 hover:bg-slate-700 transition shrink-0" title="通知のON/OFF切替">
                    🔔 通知: OFF
                </button>
                <button onclick="toggleDocumentModal()" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-emerald-400 hover:bg-slate-700 transition shrink-0" title="ドキュメント作成機能">
                    📄 ドキュメント
                </button>
                <button onclick="toggleTranslateModal()" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700 transition shrink-0">
                    翻訳
                </button>
                <button onclick="toggleHistoryModal()" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-purple-400 hover:bg-slate-700 transition shrink-0">
                    履歴
                </button>
                <button onclick="toggleMemoPanel()" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-cyan-300 hover:bg-slate-700 transition shrink-0" title="メモパネルを開く">
                    📝 メモ管理
                </button>
                <button onclick="resetApiKey()" class="text-xs md:text-sm font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition shrink-0">
                    APIキー変更
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-4xl mx-auto flex-grow flex flex-col justify-center">
        
        <!-- Search Form -->
        <div class="text-center mb-8">
            <h2 class="text-2xl md:text-4xl font-bold mb-3 font-orbitron">SEARCH AI-Pro まずは検索してみよう</h2>
            <p class="text-slate-400 text-sm md:text-base">最新のAIサーチアシスタントがあなたのあらゆる質問に答えます。</p>
        </div>

        <div class="glow-box bg-slate-900/80 backdrop-blur-md rounded-2xl p-4 md:p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-3">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="AI検索をしよう" 
                    class="flex-grow bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition"
                    onkeypress="if(event.key === 'Enter') handleSearch()"
                >
                <button 
                    id="searchBtn" 
                    onclick="handleSearch()" 
                    class="glow-button bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold px-8 py-3.5 rounded-xl text-white flex items-center justify-center space-x-2"
                >
                    <span>SEARCH</span>
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center py-12">
            <div class="loader ease-linear rounded-full border-4 border-slate-700 h-12 w-12 mb-4"></div>
            <p id="loadingText" class="font-orbitron text-cyan-400 text-sm tracking-widest animate-pulse">SEARCHING UNIVERSE...</p>
        </div>

        <!-- Results Display Container -->
        <div id="resultContainer" class="hidden glow-box bg-slate-900/90 backdrop-blur-md rounded-2xl p-6 md:p-8 space-y-6">
            <div id="topSection">
                <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                    <span class="text-xs font-orbitron text-cyan-400 uppercase tracking-widest">SEARCH AI-Pro RESULT</span>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="scrollToSummary()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-purple-400 hover:bg-slate-700 transition">
                            📌 要約へ移動
                        </button>
                        <button onclick="speakResult()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700 transition">
                            🔊 本文読み上げ
                        </button>
                        <button onclick="stopSpeech()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-red-400 hover:bg-slate-700 transition">
                            ⏹️ 停止
                        </button>
                        <button onclick="clearResult()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-red-400 transition">
                            🗑️ 結果を消す
                        </button>
                    </div>
                </div>
                <div id="resultText" class="text-slate-200 leading-relaxed space-y-4"></div>
            </div>
        </div>

    </main>

    <!-- 画面いっぱい：ドキュメント作成モーダル -->
    <div id="documentModal" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-2xl flex flex-col p-4 md:p-8 overflow-y-auto">
        <div class="max-w-4xl w-full mx-auto flex-grow flex flex-col space-y-4">
            <!-- モーダルヘッダー -->
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">📄</div>
                    <h3 class="font-orbitron text-lg md:text-xl text-emerald-400 font-bold uppercase tracking-widest">AI ドキュメント作成モード</h3>
                </div>
                <button onclick="toggleDocumentModal()" class="text-sm font-orbitron px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition">閉じる ✕</button>
            </div>

            <!-- タイトル入力 -->
            <input 
                type="text" 
                id="docTitleInput" 
                placeholder="ドキュメントのタイトルを入力..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm md:text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition font-bold"
            >

                <div class="flex items-center space-x-2">
                    <button onclick="clearDocumentContent()" class="text-xs font-orbitron px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-red-400 hover:bg-slate-700 transition">
                        🗑️ クリア
                    </button>
                </div>
            </div>

            <!-- 本文テキストエリア（キーボード入力＆音声入力結果） -->
            <textarea 
                id="docContentInput" 
                placeholder="ここにキーボードで自由に入力するか、上の「音声入力」ボタンを押してマイクに向かって話してください..." 
                class="w-full flex-grow min-h-[350px] bg-slate-900/90 border border-slate-700 rounded-xl p-4 text-sm md:text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition resize-none leading-relaxed"
            ></textarea>

            <!-- 保存アクションボタン群 -->
            <div class="flex flex-wrap justify-end items-center gap-3 pt-2">
                <button onclick="saveDocumentToMemo()" class="glow-button bg-slate-800 border border-slate-700 hover:bg-slate-700 font-orbitron text-xs font-bold px-6 py-3 rounded-xl text-cyan-300 transition flex items-center space-x-2">
                    <span>📝 メモ管理に保存</span>
                </button>
                <button onclick="downloadDocumentFile()" class="glow-button bg-gradient-to-r from-emerald-500 to-teal-600 font-orbitron text-xs font-bold px-6 py-3 rounded-xl text-white transition flex items-center space-x-2">
                    <span>💾 ハードディスクに保存 (.txt)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側スライドパネル：メモ管理（作成＆保存リストを分離） -->
    <div id="memoPanel" class="side-panel fixed top-0 right-0 h-full w-full max-w-md bg-slate-950/95 backdrop-blur-2xl border-l border-slate-800 z-50 flex flex-col p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-800">
            <h3 class="font-orbitron text-lg text-cyan-400 font-bold uppercase tracking-widest">メモ管理センター</h3>
            <button onclick="toggleMemoPanel()" class="text-sm font-orbitron px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition">閉じる ✕</button>
        </div>
        
        <div class="flex-grow overflow-y-auto space-y-6 pr-1">
            <!-- セクション①：メモの作成・編集エリア -->
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl space-y-3 shadow-inner">
                <h4 class="text-xs font-orbitron text-cyan-300 font-bold uppercase tracking-wider border-b border-slate-800 pb-2" id="memoFormTitle">✏️ メモ作成・編集エリア</h4>
                <input 
                    type="text" 
                    id="memoTitleInput" 
                    placeholder="メモのタイトル..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition"
                >
                <textarea 
                    id="memoContentInput" 
                    placeholder="メモの内容を入力..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition resize-none h-28"
                ></textarea>
                <div class="flex gap-2">
                    <button 
                        onclick="saveNewMemo()" 
                        class="glow-button flex-grow bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron text-xs font-bold py-2.5 rounded-xl text-white"
                    >
                        メモを保存する
                    </button>
                    <button 
                        id="cancelEditBtn"
                        onclick="resetMemoForm()" 
                        class="hidden px-3 bg-slate-800 border border-slate-700 font-orbitron text-xs text-slate-300 rounded-xl hover:bg-slate-700 transition"
                    >
                        キャンセル
                    </button>
                </div>
            </div>

            <!-- セクション②：保存済みメモリストエリア -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1 border-b border-slate-800 pb-2">
                    <span class="text-xs font-orbitron text-purple-400 font-bold uppercase tracking-wider">📂 保存済みメモ一覧</span>
                    <button onclick="clearAllMemos()" class="text-[10px] text-slate-400 hover:text-red-400 transition">全クリア</button>
                </div>
                <div id="savedMemosList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Translate Modal -->
    <div id="translateModal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl flex flex-col p-6 md:p-12 overflow-y-auto">
        <div class="max-w-3xl w-full mx-auto flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <h3 class="font-orbitron text-xl text-cyan-400 font-bold uppercase tracking-widest">AI 翻訳</h3>
                <button onclick="toggleTranslateModal()" class="text-sm font-orbitron px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition">閉じる ✕</button>
            </div>
            
            <div class="space-y-4 flex-grow flex flex-col">
                <div class="flex items-center justify-between text-xs text-slate-400 bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex-wrap gap-2">
                    <div class="flex items-center space-x-2">
                        <span>言語切替:</span>
                        <select id="sourceLang" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-400">
                            <option value="日本語">日本語</option>
                            <option value="英語">英語</option>
                            <option value="中国語">中国語</option>
                        </select>
                        <span>➔</span>
                        <select id="targetLang" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-400">
                            <option value="英語">英語</option>
                            <option value="日本語">日本語</option>
                            <option value="中国語">中国語</option>
                        </select>
                    </div>
                    <button onclick="handleTranslate()" class="glow-button bg-gradient-to-r from-purple-500 to-cyan-500 font-orbitron text-xs font-bold px-6 py-2 rounded-xl text-white">
                        翻訳実行
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
                    <div class="flex flex-col space-y-2">
                        <span class="text-xs text-slate-400 font-orbitron">入力文章</span>
                        <textarea 
                            id="translateInput" 
                            placeholder="翻訳したい文章を入力..." 
                            class="w-full flex-grow min-h-[150px] bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition resize-none"
                        ></textarea>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-400 font-orbitron">翻訳結果</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="copyTranslation()" class="text-xs font-orbitron px-2 py-1 rounded bg-slate-800 border border-slate-700 text-purple-400 hover:bg-slate-700 transition">📋 コピー</button>
                                <button onclick="speakTranslation()" class="text-xs font-orbitron px-2 py-1 rounded bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700 transition">🔊 読み上げ</button>
                                <button onclick="stopSpeech()" class="text-xs font-orbitron px-2 py-1 rounded bg-slate-800 border border-slate-700 text-red-400 hover:bg-slate-700 transition">⏹️ 停止</button>
                            </div>
                        </div>
                        <div class="w-full flex-grow min-h-[150px] bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 overflow-y-auto" id="translateOutput">
                            <span class="text-slate-500">ここに翻訳結果が表示されます...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen History Modal -->
    <div id="historyModal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl flex flex-col p-6 md:p-12 overflow-y-auto">
        <div class="max-w-3xl w-full mx-auto flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <h3 class="font-orbitron text-xl text-purple-400 font-bold uppercase tracking-widest">検索履歴</h3>
                <div class="flex items-center space-x-4">
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-400 transition">全履歴をクリア</button>
                    <button onclick="toggleHistoryModal()" class="text-sm font-orbitron px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition">閉じる ✕</button>
                </div>
            </div>
            <div id="historyList" class="space-y-3 flex-grow overflow-y-auto text-sm text-slate-300"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto text-center mt-12 pt-4 border-t border-slate-800 text-xs text-slate-500 font-orbitron">
        &copy; SEARCH AI-Pro ASSISTANT
    </footer>

    <!-- Scripting logic -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        let currentResponseText = "";
        let currentSummaryText = "";
        let currentQueryText = "";
        let editingMemoId = null;
        let recognition = null;
        let isListening = false;

        // ページ読み込み時に通知ボタンの初期表示を更新
        window.addEventListener("DOMContentLoaded", () => {
            updateNotificationButtonUI();
            initSpeechRecognition();
        });

        function getApiKey() {
            let apiKey = localStorage.getItem("gemini_api_key");
            if (!apiKey) {
                apiKey = prompt("Gemini APIキーを入力してください（Google AI Studioで無料で取得できます）：");
                if (apiKey) {
                    localStorage.setItem("gemini_api_key", apiKey.trim());
                } else {
                    alert("APIキーが入力されませんでした。機能を利用するにはAPIキーが必要です。");
                }
            }
            return apiKey;
        }

        window.resetApiKey = function() {
            localStorage.removeItem("gemini_api_key");
            const newKey = prompt("新しいGemini APIキーを入力してください：");
            if (newKey) {
                localStorage.setItem("gemini_api_key", newKey.trim());
                alert("APIキーを更新しました！");
            }
        }

        // --- メニューボタン自体の出し入れ（表示・非表示）切替 ---
        window.toggleMenuCollapse = function() {
            const container = document.getElementById("menuBarContainer");
            const btn = document.getElementById("menuToggleBtn");
            container.classList.toggle("collapsed");

            if (container.classList.contains("collapsed")) {
                btn.innerHTML = "▼ ボタンを表示";
            } else {
                btn.innerHTML = "▲ ボタンを隠す";
            }
        }

        // --- ドキュメント作成モードの開閉 ---
        window.toggleDocumentModal = function() {
            const modal = document.getElementById("documentModal");
            modal.classList.toggle("hidden");
        }

        window.clearDocumentContent = function() {
            if (confirm("ドキュメントの内容をクリアしますか？")) {
                document.getElementById("docTitleInput").value = "";
                document.getElementById("docContentInput").value = "";
                if (isListening) stopVoiceInput();
            }
        }

        // --- 音声入力機能 (SpeechRecognition) ---
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                const textarea = document.getElementById("docContentInput");
                textarea.value += transcript;
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopVoiceInput();
            };

            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        stopVoiceInput();
                    }
                }
            };
        }

        window.toggleVoiceInput = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("お使いのブラウザは音声入力に対応していません（Google ChromeやEdge推奨）。");
                return;
            }

            if (!recognition) {
                initSpeechRecognition();
            }

            const btn = document.getElementById("micToggleBtn");
            const status = document.getElementById("voiceStatus");

            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    btn.innerHTML = "<span>🎙️ 音声入力: ON</span>";
                    btn.classList.add("border-emerald-400", "bg-emerald-950/50", "text-emerald-400");
                    status.innerText = "（マイクに向かって話してください...）";
                } catch (e) {
                    console.error(e);
                }
            } else {
                stopVoiceInput();
            }
        }

        function stopVoiceInput() {
            if (recognition && isListening) {
                recognition.stop();
            }
            isListening = false;
            const btn = document.getElementById("micToggleBtn");
            const status = document.getElementById("voiceStatus");
            if (btn) {
                btn.innerHTML = "<span>🎙️ 音声入力: OFF</span>";
                btn.classList.remove("border-emerald-400", "bg-emerald-950/50", "text-emerald-400");
            }
            if (status) {
                status.innerText = "（音声入力停止中）";
            }
        }

        // --- ドキュメントのメモ保存＆ハードディスク保存 ---
        window.saveDocumentToMemo = function() {
            const title = document.getElementById("docTitleInput").value.trim();
            const content = document.getElementById("docContentInput").value.trim();

            if (!title && !content) {
                alert("タイトルまたは内容を入力してください。");
                return;
            }

            let memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");
            const newMemo = {
                id: Date.now(),
                title: title || "無題のドキュメント",
                content: content,
                date: new Date().toLocaleString()
            };

            memos.unshift(newMemo);
            localStorage.setItem("user_custom_memos", JSON.stringify(memos));
            alert("ドキュメントをメモ管理に保存しました！");
            
            const panel = document.getElementById("memoPanel");
            if (panel.classList.contains("open")) {
                renderSavedMemos();
            }
        }

        window.downloadDocumentFile = function() {
            const title = document.getElementById("docTitleInput").value.trim();
            const content = document.getElementById("docContentInput").value.trim();

            if (!title && !content) {
                alert("保存する内容がありません。");
                return;
            }

            const fileTitle = title || "ドキュメント";
            const fileContent = `タイトル: ${fileTitle}\n作成日時: ${new Date().toLocaleString()}\n----------------------------------------\n\n${content}`;
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileTitle.replace(/[\/\\?%*:|"<>]/g, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- 通知機能のON/OFF切替設定 ---
        window.toggleNotificationSetting = async function() {
            if (!("Notification" in window)) {
                alert("このブラウザはデスクトップ通知に対応していません。");
                return;
            }

            const currentPref = localStorage.getItem("notification_user_pref");

            if (currentPref === "on") {
                // OFFに切り替え
                localStorage.setItem("notification_user_pref", "off");
                alert("通知を OFF にしました。");
            } else {
                // ONにしようとした際、まだブラウザ権限がgrantedでなければリクエストする
                if (Notification.permission !== "granted") {
                    const permission = await Notification.requestPermission();
                    if (permission !== "granted") {
                        alert("ブラウザ側で通知の権限が許可されませんでした。ブラウザの設定をご確認ください。");
                        localStorage.setItem("notification_user_pref", "off");
                        updateNotificationButtonUI();
                        return;
                    }
                }
                localStorage.setItem("notification_user_pref", "on");
                alert("通知を ON にしました！");
            }
            updateNotificationButtonUI();
        }

        function updateNotificationButtonUI() {
            const btn = document.getElementById("notifToggleBtn");
            if (!("Notification" in window)) {
                btn.innerText = "🔔 通知非対応";
                return;
            }

            const pref = localStorage.getItem("notification_user_pref");
            // デフォルトはON（一度も設定されていなければON扱い）
            if (pref === "off") {
                btn.innerText = "🔔 通知: OFF";
                btn.classList.remove("border-cyan-400", "bg-slate-700");
            } else {
                btn.innerText = "🔔 通知: ON";
                btn.classList.add("border-cyan-400", "bg-slate-700");
            }
        }

        function showCompletionNotification(query) {
            const pref = localStorage.getItem("notification_user_pref");
            // ユーザー設定がoffでなければ（あるいは未設定なら）かつブラウザ許可があれば通知する
            if (pref !== "off" && "Notification" in window && Notification.permission === "granted") {
                const notification = new Notification("SEARCH AI-Pro", {
                    body: `「${query}」の検索・回答が完了しました！`,
                    icon: "https://fonts.gstatic.com/s/e/notoemoji/16.0/1f916/128.png"
                });
                notification.onclick = function() {
                    window.focus();
                    notification.close();
                };
            }
        }

        // --- メモパネル開閉 ---
        window.toggleMemoPanel = function() {
            const panel = document.getElementById("memoPanel");
            panel.classList.toggle("open");
            
            if (panel.classList.contains("open")) {
                renderSavedMemos();
            } else {
                resetMemoForm();
            }
        }

        window.resetMemoForm = function() {
            editingMemoId = null;
            document.getElementById("memoTitleInput").value = "";
            document.getElementById("memoContentInput").value = "";
            document.getElementById("memoFormTitle").innerText = "✏️ メモ作成・編集エリア";
            document.getElementById("cancelEditBtn").classList.add("hidden");
        }

        window.saveNewMemo = function() {
            const title = document.getElementById("memoTitleInput").value.trim();
            const content = document.getElementById("memoContentInput").value.trim();

            if (!title && !content) {
                alert("タイトルまたは内容を入力してください。");
                return;
            }

            let memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");

            if (editingMemoId !== null) {
                memos = memos.map(m => m.id === editingMemoId ? { ...m, title, content, date: new Date().toLocaleString() } : m);
                alert("メモを更新しました！");
            } else {
                const newMemo = {
                    id: Date.now(),
                    title: title || "無題のメモ",
                    content: content,
                    date: new Date().toLocaleString()
                };
                memos.unshift(newMemo);
                alert("メモを保存しました！");
            }

            localStorage.setItem("user_custom_memos", JSON.stringify(memos));
            resetMemoForm();
            renderSavedMemos();
        }

        // --- 要約文をメモに直接保存する関数 ---
        window.saveSummaryToMemo = function() {
            if (!currentSummaryText) {
                alert("保存する要約文がありません。");
                return;
            }

            const title = currentQueryText ? `要約: ${currentQueryText}` : "AI検索の要約";
            const content = currentSummaryText;

            let memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");
            const newMemo = {
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toLocaleString()
            };

            memos.unshift(newMemo);
            localStorage.setItem("user_custom_memos", JSON.stringify(memos));
            
            alert("要約文をメモに保存しました！「メモ管理」から確認できます。");
            
            const panel = document.getElementById("memoPanel");
            if (panel.classList.contains("open")) {
                renderSavedMemos();
            }
        }

        function renderSavedMemos() {
            const listContainer = document.getElementById("savedMemosList");
            const memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");

            if (memos.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-500 text-center py-6 text-xs bg-slate-900/50 rounded-xl border border-slate-800">保存されたメモはまだありません。</p>';
                return;
            }

            listContainer.innerHTML = memos.map(memo => `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
                        <span class="font-bold text-cyan-400 font-orbitron text-xs truncate mr-2">${memo.title}</span>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <button onclick="downloadMemoFile(${memo.id})" class="text-[10px] px-1.5 py-0.5 bg-slate-800 text-cyan-300 rounded hover:bg-slate-700 transition" title="ドキュメントとして保存">📥 保存</button>
                            <button onclick="editMemo(${memo.id})" class="text-[10px] px-1.5 py-0.5 bg-slate-800 text-purple-300 rounded hover:bg-slate-700 transition">編集</button>
                            <button onclick="deleteMemo(${memo.id})" class="text-[10px] px-1.5 py-0.5 bg-slate-800 text-red-400 rounded hover:bg-slate-700 transition">✕</button>
                        </div>
                    </div>
                    <div class="text-slate-300 text-xs leading-relaxed whitespace-pre-wrap max-h-20 overflow-y-auto">${memo.content}</div>
                    <div class="text-right text-[9px] text-slate-500">${memo.date}</div>
                </div>
            `).join('');
        }

        window.downloadMemoFile = function(id) {
            const memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");
            const memo = memos.find(m => m.id === id);
            if (!memo) return;

            const fileContent = `タイトル: ${memo.title}\n作成日時: ${memo.date}\n----------------------------------------\n\n${memo.content}`;
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${memo.title.replace(/[\/\\?%*:|"<>]/g, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.editMemo = function(id) {
            const memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");
            const memo = memos.find(m => m.id === id);
            if (!memo) return;

            document.getElementById("memoTitleInput").value = memo.title;
            document.getElementById("memoContentInput").value = memo.content;
            document.getElementById("memoFormTitle").innerText = "✏️ メモの編集 (ID: " + id + ")";
            document.getElementById("cancelEditBtn").classList.remove("hidden");
            editingMemoId = id;
            
            document.getElementById("memoPanel").scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deleteMemo = function(id) {
            let memos = JSON.parse(localStorage.getItem("user_custom_memos") || "[]");
            memos = memos.filter(m => m.id !== id);
            localStorage.setItem("user_custom_memos", JSON.stringify(memos));
            renderSavedMemos();
        }

        window.clearAllMemos = function() {
            if (confirm("すべての保存したメモを削除しますか？")) {
                localStorage.removeItem("user_custom_memos");
                renderSavedMemos();
            }
        }

        // --- 履歴機能 ---
        function addHistory(query) {
            let history = JSON.parse(localStorage.getItem("search_history") || "[]");
            history = [query, ...history.filter(item => item !== query)].slice(0, 20);
            localStorage.setItem("search_history", JSON.stringify(history));
            renderHistory();
        }

        window.toggleHistoryModal = function() {
            const modal = document.getElementById("historyModal");
            modal.classList.toggle("hidden");
            if (!modal.classList.contains("hidden")) {
                renderHistory();
            }
        }

        function renderHistory() {
            const historyList = document.getElementById("historyList");
            const history = JSON.parse(localStorage.getItem("search_history") || "[]");
            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-slate-500 text-center py-8">履歴はまだありません。</p>';
                return;
            }
            historyList.innerHTML = history.map((item, index) => `
                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex justify-between items-center hover:border-purple-500/50 transition">
                    <span class="cursor-pointer hover:text-cyan-400 flex-grow truncate mr-4 text-base" onclick="selectHistory('${item.replace(/'/g, "\\'")}')">
                        ✨ ${item}
                    </span>
                    <button onclick="deleteHistoryItem(${index})" class="text-xs text-slate-500 hover:text-red-400 px-3 py-1.5 bg-slate-800/80 rounded-lg transition">
                        ✕ 削除
                    </button>
                </div>
            `).join('');
        }

        window.selectHistory = function(query) {
            document.getElementById("searchInput").value = query;
            toggleHistoryModal();
            handleSearch();
        }

        window.deleteHistoryItem = function(index) {
            let history = JSON.parse(localStorage.getItem("search_history") || "[]");
            history.splice(index, 1);
            localStorage.setItem("search_history", JSON.stringify(history));
            renderHistory();
        }

        window.clearHistory = function() {
            localStorage.removeItem("search_history");
            renderHistory();
        }

        // --- 翻訳機能 ---
        window.toggleTranslateModal = function() {
            const modal = document.getElementById("translateModal");
            modal.classList.toggle("hidden");
        }

        window.handleTranslate = async function() {
            const textToTranslate = document.getElementById("translateInput").value.trim();
            const sourceLang = document.getElementById("sourceLang").value;
            const targetLang = document.getElementById("targetLang").value;
            const outputBox = document.getElementById("translateOutput");

            if (!textToTranslate) {
                alert("翻訳する文章を入力してください。");
                return;
            }

            const apiKey = getApiKey();
            if (!apiKey) return;

            outputBox.innerHTML = '<span class="text-cyan-400 animate-pulse">翻訳中...</span>';

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const promptText = `以下の${sourceLang}の文章を自然な${targetLang}に翻訳してください。余計な解説は一切含めず、翻訳結果の文章のみを出力してください。\n\n${textToTranslate}`;

                const response = await callGeminiWithSmartFallback(ai, promptText, {
                    systemInstruction: "あなたはプロの翻訳アシスタントです。指定された言語へ正確かつ自然に翻訳してください。",
                });

                outputBox.innerText = response.text.trim();
            } catch (error) {
                console.error("Translation Error:", error);
                outputBox.innerHTML = `<span class="text-red-400">翻訳エラー: ${error.message}</span>`;
            }
        }

        window.copyTranslation = function() {
            const outputBox = document.getElementById("translateOutput");
            const text = outputBox.innerText;
            if (!text || text.includes("ここに翻訳結果が表示されます")) return;
            navigator.clipboard.writeText(text).then(() => {
                alert("翻訳結果をクリップボードにコピーしました！");
            });
        }

        window.speakTranslation = function() {
            const outputBox = document.getElementById("translateOutput");
            const text = outputBox.innerText;
            if (!text || text.includes("ここに翻訳結果が表示されます")) return;
            window.speechSynthesis.cancel();
            const targetLang = document.getElementById("targetLang").value;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang === '英語' ? 'en-US' : (targetLang === '中国語' ? 'zh-CN' : 'ja-JP');
            // Google翻訳の読み上げ速度（少し聞き取りやすいゆっくりめの速度）に設定
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        window.clearResult = function() {
            window.speechSynthesis.cancel();
            currentResponseText = "";
            currentSummaryText = "";
            currentQueryText = "";
            const resultContainer = document.getElementById("resultContainer");
            const resultText = document.getElementById("resultText");
            resultText.innerHTML = "";
            resultContainer.classList.add("hidden");
            document.getElementById("searchInput").value = "";
            document.getElementById("searchInput").focus();
        }

        window.scrollToSummary = function() {
            const summaryElement = document.getElementById("summarySection");
            if (summaryElement) {
                summaryElement.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("要約セクションが見つかりません。");
            }
        }

        window.scrollToTop = function() {
            const topElement = document.getElementById("topSection");
            if (topElement) {
                topElement.scrollIntoView({ behavior: 'smooth' });
            }
        }

        window.speakResult = function() {
            if (!currentResponseText) return;
            window.speechSynthesis.cancel();
            const cleanText = currentResponseText.replace(/【要約】[\s\S]*/, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
        }

        window.speakSummary = function() {
            if (!currentSummaryText) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentSummaryText);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
        }

        window.stopSpeech = function() {
            window.speechSynthesis.cancel();
        }

        async function callGeminiWithSmartFallback(ai, contents, config) {
            const modelsToTry = [
                'gemini-3.6-flash',
                'gemini-3.5-flash',
                'gemini-3-flash-preview',
                'gemini-2.5-flash',
                'gemini-2.0-flash'
            ];
            
            let lastError = null;

            for (const model of modelsToTry) {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const response = await ai.models.generateContent({
                            model: model,
                            contents: contents,
                            config: config
                        });
                        return response;
                    } catch (error) {
                        lastError = error;
                        const errorMsg = (error.message || "").toLowerCase();
                        const is404 = errorMsg.includes("404") || errorMsg.includes("not found");
                        const isOverloaded = errorMsg.includes("503") || errorMsg.includes("overloaded") || errorMsg.includes("rate limit") || errorMsg.includes("too many requests") || errorMsg.includes("429");
                        
                        if (is404) break;
                        if (isOverloaded && attempt < 2) {
                            await new Promise(resolve => setTimeout(resolve, 1500));
                        } else if (!isOverloaded) {
                            break;
                        }
                    }
                }
            }
            throw lastError;
        }

        window.handleSearch = async function() {
            const queryInput = document.getElementById("searchInput");
            const query = queryInput.value.trim();
            const loadingIndicator = document.getElementById("loadingIndicator");
            const loadingText = document.getElementById("loadingText");
            const resultContainer = document.getElementById("resultContainer");
            const resultText = document.getElementById("resultText");

            if (!query) {
                alert("検索キーワードを入力してください。");
                return;
            }

            const apiKey = getApiKey();
            if (!apiKey) return;

            currentQueryText = query;
            addHistory(query);
            loadingIndicator.classList.remove("hidden");
            loadingText.innerText = "SEARCHING UNIVERSE...";
            resultContainer.classList.add("hidden");
            resultText.innerHTML = "";
            window.speechSynthesis.cancel();

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const response = await callGeminiWithSmartFallback(ai, query, {
                    systemInstruction: "あなたは高度な宇宙AIサーチアシスタントです。ユーザーの質問に対して詳細な情報を提供し、最後に必ず改行を入れて「【要約】」という見出しを添えて、内容を短く簡潔に要約して出力してください。",
                });

                currentResponseText = response.text;

                const parts = currentResponseText.split("【要約】");
                const mainBody = parts[0] ? parts[0].trim() : "";
                currentSummaryText = parts[1] ? parts[1].trim() : "";

                const formattedHtml = mainBody.replace(/\n/g, '<br>') + 
                    '<br><div id="summarySection" class="mt-6 pt-4 border-t border-slate-700 font-bold text-cyan-400 font-orbitron scroll-mt-6 flex flex-wrap justify-between items-center gap-2">' +
                        '<span>【要約】 SEARCH AI-Pro SUMMARY</span>' +
                        '<div class="flex items-center flex-wrap gap-2">' +
                            '<button onclick="saveSummaryToMemo()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-cyan-300 hover:bg-slate-700 transition">📥 要約をメモに保存</button>' +
                            '<button onclick="speakSummary()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700 transition">🔊 要約読み上げ</button>' +
                            '<button onclick="stopSpeech()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-red-400 hover:bg-slate-700 transition">⏹️ 停止</button>' +
                            '<button onclick="scrollToTop()" class="text-xs font-orbitron px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-purple-400 hover:bg-slate-700 transition">⬆ 本文に戻る</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="mt-3 text-slate-200 leading-relaxed">' + currentSummaryText.replace(/\n/g, '<br>') + '</div>';

                resultText.innerHTML = formattedHtml;
                resultContainer.classList.remove("hidden");
                resultContainer.scrollIntoView({ behavior: 'smooth' });

                showCompletionNotification(query);

            } catch (error) {
                console.error("API Error:", error);
                let userMessage = "エラーが発生しました: " + error.message;
                if (error.message && (error.message.includes("404") || error.message.includes("not found"))) {
                    userMessage = "利用可能なAIモデルが見つかりませんでした。入力されたAPIキーにアクセス権限があるか、Google AI Studioをご確認ください。";
                } else if (error.message && (error.message.includes("503") || error.message.includes("overloaded") || error.message.includes("429"))) {
                    userMessage = "サーバーが混み合っているか、無料枠の制限に達しました。少し時間を置いてから再度検索してください。";
                }
                alert(userMessage);
            } finally {
                loadingIndicator.classList.add("hidden");
            }
        }
    </script>
